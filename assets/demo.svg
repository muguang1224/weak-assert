  <text x="96" y="33" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">bash — weak-assert</text>
  <line x1="0" y1="52" x2="940" y2="52" stroke="#1E293B"/>
