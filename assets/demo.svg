  <text x="34" y="118" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#F8FAFC">$ weak-assert tests --fail-on high</text><text x="34" y="140" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1">weak-assert 1.0.0: scanned 128 tests in 14 files; 6 have no assertion.</text><text x="34" y="162" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1"></text><text x="34" y="184" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#FDA4AF">HIGH   WA005  tests/test_payments.py:41  test_rejects</text><text x="34" y="206" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#94A3B8">       except handler swallows the assertion failure without re-raising</text><text x="34" y="228" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#64748B">       |     except AssertionError:</text><text x="34" y="250" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1"></text><text x="34" y="272" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#FCD34D">MEDIUM WA001  tests/test_users.py:88  test_updates_profile</text><text x="34" y="294" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#94A3B8">       test body has no assertion; it only exercises code</text><text x="34" y="316" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1"></text><text x="34" y="338" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#FCD34D">MEDIUM WA002  tests/test_math.py:12  test_adds</text><text x="34" y="360" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#94A3B8">       comparison between literals can never detect a regression</text><text x="34" y="382" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#64748B">       |     assert 1 == 1</text><text x="34" y="404" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1"></text><text x="34" y="426" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#CBD5E1">6 findings (1 high, 4 medium, 1 low)</text><text x="34" y="448" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#F8FAFC">$ echo $?</text><text x="34" y="470" xml:space="preserve" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#FDA4AF">1</text>
</svg>
